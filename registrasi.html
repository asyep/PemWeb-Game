<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi</title>
</head>
<body>
    <h1 align="center" style="font-size: 40px;">📋 Registrasi Petualang</h1>
    <div align="center">
        <form action="login.html" method="get" enctype="multipart/form-data">
            <table cellpadding="10">
                <tr>
                    <td><label for="username">👤 Username:</label></td>
                    <td><input type="text" id="username" name="username" placeholder="Masukkan username" required></td>
                </tr>
                <tr>
                    <td><label for="email">📧 Email:</label></td>
                    <td><input type="email" id="email" name="email" placeholder="Masukkan email" required></td>
                </tr>
                <tr>
                    <td><label for="password">🔒 Password:</label></td>
                    <td><input type="password" id="password" name="password" placeholder="Buat password" minlength="6" required></td>
                </tr>
                <tr>
                    <td><label for="confirm-password">🔑 Konfirmasi Password:</label></td>
                    <td><input type="password" id="confirm-password" name="confirm-password" placeholder="Ulangi password" required></td>
                </tr>
                <tr>
                    <td><label for="birthdate">🎂 Tanggal Lahir:</label></td>
                    <td><input type="date" id="birthdate" name="birthdate" required></td>
                </tr>
                <tr>
                    <td><label for="avatar">🖼️ Foto Profil:</label></td>
                    <td><input type="file" id="avatar" name="avatar" accept="image/*" required></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <button type="submit" style="font-size: 20px; padding: 10px 20px;">📨 Daftar</button>
                    </td>
                </tr>
            </table>
        </form>
        <p>Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>
</body>
</html>
