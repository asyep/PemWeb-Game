<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center" style="font-size: 40px;">🔑 Login Petualang</h1>
    <div align="center">
        <form action="index.html" method="get">
            <table cellpadding="10">
                <tr>
                    <td><label for="email">📧 Email:</label></td>
                    <td><input type="email" id="email" name="email" placeholder="Masukkan email" required></td>
                </tr>
                <tr>
                    <td><label for="password">🔒 Password:</label></td>
                    <td><input type="password" id="password" name="password" placeholder="Masukkan password" required></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <button type="submit" style="font-size: 20px; padding: 10px 20px;">➡️ Masuk</button>
                    </td>
                </tr>
            </table>
        </form>
        <p>Belum punya akun? <a href="registrasi.html">Daftar di sini</a></p>
    </div>
</body>
</html>
