<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Petualang</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="container">
        <h1>🗺️ Daftar Petualang</h1>
        <form action="login.html" method="get" enctype="multipart/form-data">
            <label for="username">🧭 Username:</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username" required>

            <label for="email">📜 Email:</label>
            <input type="email" id="email" name="email" placeholder="Masukkan email" required>

            <label for="password">🔐 Password:</label>
            <input type="password" id="password" name="password" placeholder="Buat password" minlength="6" required>

            <label for="confirm-password">🔑 Konfirmasi Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Ulangi password" required>

            <label for="birthdate">🎉 Tanggal Lahir:</label>
            <input type="date" id="birthdate" name="birthdate" required>

            <label for="avatar">🖼️ Foto Profil:</label>
            <input type="file" id="avatar" name="avatar" accept="image/*" required>

            <button type="submit">📨 Daftar Sekarang</button>
        </form>
        <p>Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>
</body>
</html>
